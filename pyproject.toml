[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-apprentice-desktop"
version = "0.2.0"
description = "Learn expert judgment through screen observation, evidence-backed Work Maps, and tutoring."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
ai-apprentice-backend = "backend.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["apprentice*", "backend*"]

[tool.setuptools.package-data]
apprentice = ["ui/*.qml", "ui/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
